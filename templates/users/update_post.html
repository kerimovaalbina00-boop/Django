{% extends 'base.html' %}

{% load static %}

{% block content %}

<div class="container mt-5">
    <h2>Обновить пост</h2>
    <div class="card" style="width: 100%; max-width: 600px;">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Обновить пост</button>
            </form>
        </div>
    </div>

    <div class="card mt-5" style="width: 100%; max-width: 600px;">
        <div class="card-body">
            <h5 class="card-title">Комментарии</h5>
            {% for comment_post in comment_for_model %}
            <p class="card-text">{{ comment_post.content }}</p>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock content %}
